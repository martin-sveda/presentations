<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presentations</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111317;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  main { width: min(720px, 90vw); padding: 2rem 0; }
  h1 { font-size: 1.75rem; margin-bottom: 1.5rem; }
  ul.deck-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
  li.deck { display: flex; gap: 0.5rem; }
  li.deck a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    border-radius: 0.75rem;
    background: #1a1d23;
    color: inherit;
    text-decoration: none;
    border: 1px solid #2a2e37;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  li.deck a.deck-link { flex: 1; min-width: 0; }
  li.deck a.deck-pdf { flex: none; font-size: 0.85rem; font-weight: 600; }
  li.deck a:hover { border-color: #6366f1; background: #20242c; }
  .deck-title { font-size: 1.05rem; }
  .deck-date { font-size: 0.85rem; opacity: 0.55; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Presentations</h1>
  <ul class="deck-list">
    
    <li class="deck">
      <a class="deck-link" href="/presentations/2026-12-02-ai-lessons/">
        <span class="deck-title">AI adoption beyond demo: Lessons from industrial R&amp;D</span>
        <span class="deck-date">2026-12-02</span>
      </a>
      <a class="deck-pdf" href="/presentations/2026-12-02-ai-lessons/2026-12-02-ai-lessons.pdf" title="Download PDF">PDF</a>
    </li>
  </ul>
</main>
</body>
</html>
